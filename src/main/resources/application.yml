spring:
  application:
    name: raibu
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/raibu}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            issuer-uri: ${GOOGLE_ISSUER_URI:https://accounts.google.com}

server:
  port: ${PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

# for WebSocket
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://raibu.app}

raibu:
  api:
    local-url: ${API_LOCAL_URL:http://localhost:8080}
    production-url: ${API_PRODUCTION_URL:https://api.raibu.app}
    contact-url: ${CONTACT_URL:https://raibu.app}
