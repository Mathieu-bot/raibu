name: Build and Deploy

on:
  push:
    branches:
      - "preprod"
      - "prod"
  workflow_dispatch:

# One deployment per environment at a time; a running deployment is never cancelled midway.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: tafitamathieu/raibu

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}

  boot-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The published image must start on an empty database before anything is deployed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: raibu
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d raibu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start the image against an empty database
        run: |
          docker run -d --name raibu-boot-check --network host \
            -e DATABASE_URL=jdbc:postgresql://localhost:5432/raibu \
            -e DATABASE_USERNAME=ci \
            -e DATABASE_PASSWORD=ci \
            -e GOOGLE_CLIENT_ID=ci-placeholder \
            -e GOOGLE_CLIENT_SECRET=ci-placeholder \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e PORT=8080 \
            "${IMAGE}:${GITHUB_SHA}"

      - name: Wait for /ping to answer 200
        run: |
          deadline=$((SECONDS + 240))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8080/ping || true)
            echo "GET /ping -> ${code}"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' raibu-boot-check)" != "true" ]; then
              break
            fi
            sleep 5
          done
          echo "::error::The image did not start and answer /ping with 200."
          docker logs raibu-boot-check | tail -60
          exit 1

  deploy:
    needs: boot-check
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      # Render-specific step: isolated so the hosting provider can be replaced.
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set for the ${GITHUB_REF_NAME} environment."
            exit 1
          fi
          IMG_URL="docker.io%2F${IMAGE//\//%2F}%3A${GITHUB_SHA}"
          curl --fail -sS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${IMG_URL}"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: ${{ github.ref_name }}

    steps:
      - name: Wait for /ping to answer 200
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::APP_URL is not set for the ${GITHUB_REF_NAME} environment, skipping the smoke test."
            exit 0
          fi
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${APP_URL%/}/ping" || true)
            echo "GET ${APP_URL%/}/ping -> ${code}"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::${APP_URL%/}/ping did not return 200 within 5 minutes."
          exit 1
