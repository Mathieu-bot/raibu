name: Build and Deploy

on:
  push:
    branches:
      - "preprod"
      - "prod"
  workflow_dispatch:

env:
  IMAGE: tafitamathieu/raibu

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set, skipping (Render must pull ${IMAGE}:${GITHUB_REF_NAME} itself)."
            exit 0
          fi
          IMG_URL="docker.io%2F${IMAGE//\//%2F}%3A${GITHUB_SHA}"
          curl --fail -sS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${IMG_URL}"
