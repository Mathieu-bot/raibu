name: Build and Deploy

on:
  push:
    branches:
      - "preprod"
      - "prod"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/mathieu-bot/raibu:latest .
          docker build -t ghcr.io/mathieu-bot/raibu:${{ github.sha }} .

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image (latest)
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/mathieu-bot/raibu:latest

      - name: Push Docker image (SHA tagged)
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/mathieu-bot/raibu:${{ github.sha }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raibu-app
          path: build/libs/app.jar

  deploy-preprod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'preprod'
    environment: preprod
    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: raibu-app
          path: .

      - name: Deploy to Preprod
        run: |
          echo "Deploying to preprod..."
          ls -la app.jar

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'prod'
    environment: prod
    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: raibu-app
          path: .

      - name: Deploy to Production
        run: |
          echo "Deploying to production..."
          ls -la app.jar
